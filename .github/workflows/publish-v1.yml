name: Publish Sensor Lock 1.0.0 release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v1.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify APK
        run: |
          echo "5e41ae0b572f009d00016a00999475951d8c46c14735788b7dcf8b34a17e98b4  releases/SensorLock-1.0.0.apk" | sha256sum -c -
          grep -Fx "5e41ae0b572f009d00016a00999475951d8c46c14735788b7dcf8b34a17e98b4  SensorLock-1.0.0.apk" releases/SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          Initial public release of Sensor Lock by ELUQEN.

          - Android 11+ (API 30+)
          - No root required
          - Local on-device camera and microphone privacy control
          - Automatic post-reboot recovery when Wi-Fi becomes available
          - Recovery after reboot may take several tens of seconds while Android Wireless debugging becomes ready
          - English, Persian and French interface
          - Language-aware ELUQEN website and app-store links
          - No ads, analytics, tracking or cloud backend

          The signed APK is attached to this release. Full source code and documentation are available in this repository.
          EOF
          gh release create v1.0.0             releases/SensorLock-1.0.0.apk             releases/SHA256SUMS.txt             --target main             --title "Sensor Lock 1.0.0"             --notes-file /tmp/release-notes.md
