name: Import Sensor Lock source

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/import-sensor-lock.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download final source snapshot
        run: |
          curl -fL --connect-timeout 15 --max-time 120             "http://46.101.102.9:18767/sensor-lock/_publish/SensorLock-1.0.0-source-sync.tar.gz"             -o /tmp/source-sync.tar.gz
          echo "cfd0976eceab13e0dd16e121c6f8098caa74a96728ba420e4edca04535de8a1a  /tmp/source-sync.tar.gz" | sha256sum -c -

      - name: Import source
        run: |
          tar -xzf /tmp/source-sync.tar.gz -C .
          rm -f RELEASE_NOTES_1.0.0.md
          git config user.name "ELUQEN Release Bot"
          git config user.email "support@eluqen.com"
          git add -A
          git commit -m "Publish Sensor Lock 1.0.0 source"
          git push origin main
